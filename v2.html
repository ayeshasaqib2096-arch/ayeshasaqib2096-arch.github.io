<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Free AI">
<meta name="theme-color" content="#0b6e7f">
<title>Free AI</title>
<style>
:root{--bg:#f6f8f9;--pn:#fff;--ink:#14212a;--mu:#64757f;--ln:#dde4e8;--ac:#0b6e7f;--af:#fff;--me:#0b6e7f;--er:#b3342d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1519;--pn:#162027;--ink:#e8eff2;--mu:#8ea1ab;--ln:#27363f;--ac:#3fb5c8;--af:#06181c;--me:#1d5663;--er:#ff8a82}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;background:var(--pn);border-bottom:1px solid var(--ln)}
header h1{font-size:17px;margin:0;flex:1;text-align:center;line-height:1.2}
h1 small{display:block;font-size:11px;font-weight:400;color:var(--mu)}
.ib{border:0;background:none;font-size:15px;color:var(--ac);font-weight:600;padding:8px;min-height:44px}
#log{flex:1;overflow-y:auto;padding:16px 12px}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{word-wrap:break-word;white-space:pre-wrap}
.m.u{align-self:flex-end;max-width:88%;background:var(--me);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px}
.m.a{align-self:flex-start;width:100%}
.er{color:var(--er)}
.ac{display:flex;gap:16px;margin-top:2px;white-space:normal}
.ac button{border:0;background:none;color:var(--mu);font-size:14px;padding:6px 0;min-height:32px}
.cb{background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin:8px 0;overflow:hidden;white-space:normal}
.ch{display:flex;justify-content:space-between;padding:4px 10px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--ln)}
.ch button{border:0;background:none;color:var(--ac);font-size:12px}
.cb pre{margin:0;padding:10px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre}
code{background:var(--pn);border:1px solid var(--ln);padding:0 5px;border-radius:5px;font:14px ui-monospace,Menlo,monospace}
.hero{margin:6vh auto 0;max-width:460px;white-space:normal}
.hero h2{margin:0 0 6px}.hero p{color:var(--mu);margin:0 0 12px}
.chip{display:block;width:100%;text-align:left;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:44px}
#cp{padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.box{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--pn);border:1px solid var(--ln);border-radius:24px;padding:6px 6px 6px 16px}
#in{flex:1;border:0;outline:0;background:none;resize:none;max-height:150px;padding:8px 0;font-size:16px}
#go{width:40px;height:40px;border-radius:50%;border:0;background:var(--ac);color:var(--af);font-size:18px;font-weight:700}
.fine{text-align:center;font-size:11px;color:var(--mu);margin-top:4px}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--pn);color:var(--ink);width:min(92vw,460px);padding:18px;max-height:88dvh}
dialog::backdrop{background:#0008}
dialog label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
dialog select,dialog input,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:16px}
.pri{background:var(--ac);color:var(--af);border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
#note{font-size:13px;color:var(--er);min-height:18px;margin-top:6px}
.hi{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--ln)}
.hi span{flex:1;cursor:pointer;padding:10px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi button{border:0;background:none;color:var(--mu);padding:10px}
</style>
</head>
<body>
<header><button class="ib" id="hb">Chats</button><h1>Free AI<small id="sub"></small></h1><button class="ib" id="nb">New</button><button class="ib" id="sb">Settings</button></header>
<main id="log"></main>
<div id="cp"><div class="box"><textarea id="in" rows="1" placeholder="Message" aria-label="Message"></textarea><button id="go" aria-label="Send">&#8593;</button></div>
<div class="fine">Messages go to the AI provider you chose. Don't share passwords or ID numbers.</div></div>
<dialog id="st"><h2 style="margin:0">Settings</h2>
<label>AI provider (all have free plans)</label><select id="ps"><option value="groq">Groq</option><option value="gemini">Gemini</option><option value="openrouter">OpenRouter</option></select>
<label>Free API key <span id="kl"></span></label><input id="ky" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste key here">
<label>Model</label><select id="ms"></select><div id="note"></div>
<label>About you / how to reply (optional)</label><textarea id="me" rows="3" placeholder="e.g. I am a student. Keep answers short."></textarea>
<div style="display:flex;gap:8px;margin-top:14px"><button class="pri" id="sv" style="flex:1">Save</button><button class="pri" id="cx" style="background:var(--bg);color:var(--ink);border:1px solid var(--ln)">Close</button></div></dialog>
<dialog id="hs"><h2 style="margin:0 0 8px">Your chats</h2><div id="hl"></div><button class="pri" id="hx" style="margin-top:12px;width:100%">Close</button></dialog>
<script>
const $=i=>document.getElementById(i);
const P={groq:["https://api.groq.com/openai/v1","console.groq.com"],gemini:["https://generativelanguage.googleapis.com/v1beta/openai","aistudio.google.com"],openrouter:["https://openrouter.ai/api/v1","openrouter.ai"]};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let prov=LS.get("fas_prov");if(!P[prov])prov="groq";
let chats=[];try{chats=JSON.parse(LS.get("fai2")||"[]")}catch(e){}
let cur=null,busy=false,ctrl=null,err=null;
const DEF="Reply in the same language the user writes in (Roman Urdu stays Roman Urdu). Be clear, accurate and friendly.";
const key=()=>LS.get("fas_key_"+prov)||"";
const model=()=>LS.get("fai_model_"+prov)||"";
const save=()=>LS.set("fai2",JSON.stringify(chats.slice(0,40)));
const C=()=>chats.find(c=>c.id===cur);
function newChat(){const c={id:Date.now()+"",title:"New chat",msgs:[]};chats.unshift(c);cur=c.id;err=null;save()}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function fmt(t){
  return esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>`<div class="cb"><div class="ch"><span>${l||"code"}</span><button data-cc="${encodeURIComponent(c.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&"))}">Copy</button></div><pre>${c}</pre></div>`)
  .replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/^#{1,3} (.+)$/gm,"<b>$1</b>");
}
function hdr(){$("sub").textContent=key()?(model()||"Choose a model in Settings"):"Add your free key in Settings"}
function render(){
  const c=C();let h='<div class="w">';
  if(!c.msgs.length&&!busy&&!err){
    h+=key()?`<div class="hero"><h2>How can I help?</h2><p>Ask anything, or tap an idea.</p><button class="chip" data-q="Mujhe aasan alfaaz mein samjhao ke AI kya hai.">Explain something simply</button><button class="chip" data-q="Mere liye ek professional email likhne mein madad karo.">Help me write an email</button><button class="chip" data-q="Mere liye 7 din ka study plan banao.">Make a study plan</button><button class="chip" data-q="Mujhe Python seekhne ka aasan tareeqa batao.">Learn to code</button></div>`
    :`<div class="hero"><h2>Welcome</h2><p>Free AI needs a free key from Groq. It takes about 2 minutes:<br>1. Open console.groq.com and sign up free.<br>2. Create an API key and copy it.<br>3. Tap Settings here, paste the key, press Save.</p><button class="chip" data-set="1">Open Settings</button></div>`;
  }
  c.msgs.forEach((m,i)=>{h+=m.role==="user"?`<div class="m u">${esc(m.content)}</div>`:`<div class="m a">${fmt(m.content)}<div class="ac"><button data-cp="${i}">Copy</button>${i===c.msgs.length-1&&!busy?'<button data-rg="1">Regenerate</button>':''}</div></div>`});
  if(busy)h+='<div class="m a" id="live">...</div>';
  if(err)h+=`<div class="m a er">${esc(err)}<div class="ac"><button data-rt="1">Retry</button></div></div>`;
  $("log").innerHTML=h+'</div>';$("log").scrollTop=$("log").scrollHeight;hdr();
}
function setBtn(){$("go").innerHTML=busy?"&#9632;":"&#8593;"}
async function run(){
  const c=C();err=null;busy=true;setBtn();render();
  const mem=(LS.get("fas_mem")||"").trim();
  const sys=DEF+(mem?"\nAbout the user: "+mem:"");
  ctrl=new AbortController();let acc="";
  try{
    if(!key())throw new Error("Add your free API key in Settings first.");
    if(!model())throw new Error("Choose a model in Settings.");
    const r=await fetch(P[prov][0]+"/chat/completions",{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json",Authorization:"Bearer "+key()},body:JSON.stringify({model:model(),stream:true,messages:[{role:"system",content:sys},...c.msgs.map(m=>({role:m.role,content:m.content}))]})});
    if(!r.ok){let t="";try{t=(await r.text()).slice(0,200)}catch(e){}throw new Error("Provider error "+r.status+". "+t)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
      for(const l of ls){if(!l.startsWith("data:")||l.includes("[DONE]"))continue;try{const d=JSON.parse(l.slice(5)).choices?.[0]?.delta?.content;if(d){acc+=d;const lv=$("live");if(lv){lv.innerHTML=fmt(acc);$("log").scrollTop=$("log").scrollHeight}}}catch(e){}}}
    if(!acc)throw new Error("The model sent an empty reply. Try another model in Settings.");
    c.msgs.push({role:"assistant",content:acc});
  }catch(e){
    if(acc)c.msgs.push({role:"assistant",content:acc});
    if(e.name!=="AbortError")err=e.message==="Failed to fetch"?"Couldn't reach the provider. Check your internet and try again.":(e.message||"Something went wrong.");
  }
  busy=false;ctrl=null;save();setBtn();render();
}
function send(txt){
  if(busy){ctrl&&ctrl.abort();return}
  const t=(txt||$("in").value).trim();if(!t)return;
  $("in").value="";grow();const c=C();c.msgs.push({role:"user",content:t});
  if(c.title==="New chat")c.title=t.slice(0,40);run();
}
function grow(){const i=$("in");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,150)+"px"}
const BAD=/guard|whisper|tts|orpheus|allam|embed|safeguard|moderation|image|imagen|veo|aqa|live|audio|transcribe|robotics|computer/i;
const PREF=["gpt-oss-120b","llama-3.3-70b","gemini-2.5-flash","gemini-flash","llama-3.1-8b","gpt-oss-20b","qwen"];
const rank=i=>{const k=PREF.findIndex(p=>i.includes(p));return k<0?99:k};
async function loadModels(){
  const s=$("ms");s.innerHTML="";$("note").textContent="";
  if(!key()){$("note").textContent="Paste your key above first.";return}
  try{
    const r=await fetch(P[prov][0]+"/models",{headers:{Authorization:"Bearer "+key()}});
    if(!r.ok)throw new Error(r.status==401?"That key was not accepted. Check it and try again.":"Provider error "+r.status);
    let ids=((await r.json()).data||[]).map(m=>m.id.replace(/^models\//,"")).filter(i=>!BAD.test(i));
    if(prov==="openrouter")ids=ids.filter(i=>i.endsWith(":free"));
    if(prov==="gemini")ids=ids.filter(i=>/gemini|gemma/.test(i));
    ids.sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
    ids.forEach(i=>{const o=document.createElement("option");o.value=o.textContent=i;s.appendChild(o)});
    if(!ids.length){$("note").textContent="No chat models found for this key.";return}
    s.value=ids.includes(model())?model():ids[0];
  }catch(e){$("note").textContent=e.message==="Failed to fetch"?"Couldn't connect. Check your internet.":e.message}
}
function openSet(){
  $("ps").value=prov;$("ky").value=key();$("me").value=LS.get("fas_mem")||"";
  $("kl").textContent="(get it at "+P[prov][1]+")";$("st").showModal();loadModels();
}
$("ps").onchange=()=>{prov=$("ps").value;LS.set("fas_prov",prov);$("ky").value=key();$("kl").textContent="(get it at "+P[prov][1]+")";loadModels()};
$("ky").onchange=()=>{LS.set("fas_key_"+prov,$("ky").value.trim());loadModels()};
$("sv").onclick=()=>{LS.set("fas_key_"+prov,$("ky").value.trim());LS.set("fas_prov",prov);if($("ms").value)LS.set("fai_model_"+prov,$("ms").value);LS.set("fas_mem",$("me").value);$("st").close();render()};
$("cx").onclick=()=>$("st").close();
$("sb").onclick=openSet;
$("nb").onclick=()=>{if(busy&&ctrl)ctrl.abort();newChat();render()};
function hist(){$("hl").innerHTML=chats.map(c=>`<div class="hi"><span data-open="${c.id}">${esc(c.title)}</span><button aria-label="Delete" data-del="${c.id}">&#10005;</button></div>`).join("")||"<p>No chats yet.</p>"}
$("hb").onclick=()=>{hist();$("hs").showModal()};
$("hx").onclick=()=>$("hs").close();
document.addEventListener("click",e=>{
  const t=e.target,d=t.dataset||{},c=C();
  if(d.cc!==undefined){try{navigator.clipboard.writeText(decodeURIComponent(d.cc));t.textContent="Copied"}catch(x){}}
  else if(d.cp!==undefined){try{navigator.clipboard.writeText(c.msgs[+d.cp].content);t.textContent="Copied"}catch(x){}}
  else if(d.rg){if(!busy&&c.msgs.at(-1).role==="assistant"){c.msgs.pop();run()}}
  else if(d.rt){if(c.msgs.length&&c.msgs.at(-1).role==="assistant")c.msgs.pop();if(c.msgs.length)run();else{err=null;render()}}
  else if(d.q){send(d.q)}
  else if(d.set){openSet()}
  else if(d.open){const i=chats.findIndex(x=>x.id===d.open);chats.unshift(chats.splice(i,1)[0]);cur=d.open;err=null;save();$("hs").close();render()}
  else if(d.del){chats=chats.filter(x=>x.id!==d.del);if(!chats.length)newChat();else if(cur===d.del)cur=chats[0].id;save();hist();render()}
});
$("go").onclick=()=>send();
$("in").oninput=grow;
$("in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!/iPhone|iPad|Android/i.test(navigator.userAgent)){e.preventDefault();send()}};
(function(){const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");x.fillStyle="#0b6e7f";x.fillRect(0,0,180,180);x.fillStyle="#fff";x.font="bold 84px system-ui,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("AI",90,96);const u=c.toDataURL("image/png");["apple-touch-icon","icon"].forEach(r=>{const l=document.createElement("link");l.rel=r;l.href=u;document.head.appendChild(l)})})();
if(!chats.length)newChat();else cur=chats[0].id;
render();
</script>
</body>
</html>
